apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-host
  labels:
    app: gateway-host
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: gateway-host
  template:
    metadata:
      labels:
        app: gateway-host
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      terminationGracePeriodSeconds: 30
      containers:
        - name: gateway-host
          image: gateway-host:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: Production
            - name: Auth__Enabled
              value: "true"
            - name: Auth__Authority
              valueFrom:
                secretKeyRef:
                  name: gateway-auth
                  key: authority
            - name: Auth__Audience
              valueFrom:
                secretKeyRef:
                  name: gateway-auth
                  key: audience
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: gateway-host
spec:
  selector:
    app: gateway-host
  ports:
    - protocol: TCP
      port: 80
      targetPort: http
  type: ClusterIP
